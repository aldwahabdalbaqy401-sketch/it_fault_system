{% extends 'base.html' %}

{% block title %}إعادة تعيين كلمة المرور{% endblock %}

{% block content %}
<div class="login-simple-wrapper">
    <div class="login-simple-card">
        <div class="login-simple-header">
            <h1>🔑 إعادة تعيين كلمة المرور</h1>
            <p>أدخل كلمة المرور الجديدة</p>
        </div>

        <form method="POST" action="{{ url_for('reset_password') }}" class="login-simple-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="email" value="{{ email }}">
            
            <!-- ===== حقل user_id المخفي ===== -->
            <input type="hidden" name="user_id" value="{{ user_id }}">

            <div class="form-group">
                <label for="password">🔑 كلمة المرور الجديدة</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور الجديدة" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">✅ تأكيد كلمة المرور</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="أعد إدخال كلمة المرور" required minlength="6">
            </div>

            <button type="submit" class="btn-login-simple">💾 تغيير كلمة المرور</button>
        </form>

        <div class="login-footer-simple">
            <p><a href="{{ url_for('login') }}">⬅️ رجوع إلى تسجيل الدخول</a></p>
        </div>
    </div>
</div>

<style>
.login-simple-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #0f023d, #1a1a4e);
    padding: 20px;
}

.login-simple-card {
    background: #ffffff;
    padding: 40px 35px;
    border-radius: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.login-simple-header h1 {
    font-size: 28px;
    font-weight: 800;
    color: #1a1a3e;
    margin: 0 0 6px 0;
}

.login-simple-header p {
    font-size: 15px;
    color: #6b7280;
    margin: 0 0 25px 0;
}

.login-simple-form .form-group {
    margin-bottom: 18px;
    text-align: right;
}

.login-simple-form .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #1a1a3e;
    margin-bottom: 6px;
}

.login-simple-form .form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    transition: all 0.3s ease;
    background: #f8fafc;
    box-sizing: border-box;
}

.login-simple-form .form-group input:focus {
    border-color: #4a6cf7;
    outline: none;
    box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.1);
    background: #ffffff;
}

.btn-login-simple {
    width: 100%;
    padding: 14px;
    background: linear-gradient(145deg, #4a6cf7, #6366f1);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: var(--font-ui, var(--font-arabic));
}

.btn-login-simple:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(74, 108, 247, 0.4);
}

.login-footer-simple {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #6b7280;
}

.login-footer-simple a {
    color: #4a6cf7;
    text-decoration: none;
    font-weight: 600;
}

.login-footer-simple a:hover {
    text-decoration: underline;
}

/* ===== التوافق مع الجوال ===== */
@media (max-width: 480px) {
    .login-simple-card {
        padding: 25px 20px;
    }
    .login-simple-header h1 {
        font-size: 20px;
    }
}
</style>

<!-- ===== تحسين تجربة المستخدم ===== -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        
        // ===== التركيز التلقائي =====
        passwordInput.focus();
        
        // ===== التحقق من تطابق كلمة المرور =====
        confirmInput.addEventListener('input', function() {
            if (this.value.length > 0 && this.value !== passwordInput.value) {
                this.style.borderColor = '#ef4444';
                this.style.boxShadow = '0 0 0 4px rgba(239, 68, 68, 0.1)';
            } else if (this.value.length > 0 && this.value === passwordInput.value) {
                this.style.borderColor = '#22c55e';
                this.style.boxShadow = '0 0 0 4px rgba(34, 197, 94, 0.1)';
            } else {
                this.style.borderColor = '#e2e8f0';
                this.style.boxShadow = 'none';
            }
        });
        
        passwordInput.addEventListener('input', function() {
            if (confirmInput.value.length > 0 && this.value !== confirmInput.value) {
                confirmInput.style.borderColor = '#ef4444';
                confirmInput.style.boxShadow = '0 0 0 4px rgba(239, 68, 68, 0.1)';
            } else if (confirmInput.value.length > 0 && this.value === confirmInput.value) {
                confirmInput.style.borderColor = '#22c55e';
                confirmInput.style.boxShadow = '0 0 0 4px rgba(34, 197, 94, 0.1)';
            }
        });
    });
</script>
{% endblock %}
