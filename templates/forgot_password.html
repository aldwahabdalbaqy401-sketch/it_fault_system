{% extends 'base.html' %}

{% block title %}نسيت كلمة المرور{% endblock %}

{% block content %}
<div class="login-simple-wrapper">
    <div class="login-simple-card">
        <div class="login-simple-header">
            <h1><i class="bi bi-key-fill text-primary me-2"></i> نسيت كلمة المرور</h1>
            <p>أدخل بريدك الإلكتروني لإرسال رمز التحقق</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}" class="login-simple-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email"><i class="bi bi-envelope me-1"></i> البريد الإلكتروني</label>
                <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>
            </div>

            <button type="submit" class="btn-login-simple"><i class="bi bi-send me-1"></i> إرسال رمز التحقق</button>
        </form>

        <div class="login-footer-simple">
            <p><a href="{{ url_for('login') }}"><i class="bi bi-arrow-right me-1"></i> رجوع إلى تسجيل الدخول</a></p>
        </div>
    </div>
</div>

<style>
.login-simple-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #0f023d, #1a1a4e);
    padding: 20px;
}

.login-simple-card {
    background: #ffffff;
    padding: 40px 35px;
    border-radius: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.login-simple-header h1 {
    font-size: 28px;
    font-weight: 800;
    color: #1a1a3e;
    margin: 0 0 6px 0;
}

.login-simple-header p {
    font-size: 15px;
    color: #6b7280;
    margin: 0 0 25px 0;
}

.login-simple-form .form-group {
    margin-bottom: 18px;
    text-align: right;
}

.login-simple-form .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #1a1a3e;
    margin-bottom: 6px;
}

.login-simple-form .form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    transition: all 0.3s ease;
    background: #f8fafc;
    box-sizing: border-box;
}

.login-simple-form .form-group input:focus {
    border-color: #4a6cf7;
    outline: none;
    box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.1);
    background: #ffffff;
}

.btn-login-simple {
    width: 100%;
    padding: 14px;
    background: linear-gradient(145deg, #4a6cf7, #6366f1);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: var(--font-ui, var(--font-arabic));
}

.btn-login-simple:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(74, 108, 247, 0.4);
}

.login-footer-simple {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #6b7280;
}

.login-footer-simple a {
    color: #4a6cf7;
    text-decoration: none;
    font-weight: 600;
}

.login-footer-simple a:hover {
    text-decoration: underline;
}

@media (max-width: 480px) {
    .login-simple-card {
        padding: 25px 20px;
    }
    .login-simple-header h1 {
        font-size: 20px;
    }
}
</style>
{% endblock %}
